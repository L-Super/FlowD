name: build

on:
    push:
        branches:
          - "main"
          - "feature/**"
          - "bugfix/**"
        paths-ignore:
            - "README.md"
            - "README-zh.md"
            - "LICENSE"
    pull_request:
        branches:
          - "main"
          - "feature/**"
          - "bugfix/**"
        paths-ignore:
          - "README.md"
          - "README-zh.md"
          - "LICENSE"

jobs:
    linux-build:
        runs-on: ubuntu-latest

        strategy:
            # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations.
            # Consider changing this to true when your workflow is stable.
            fail-fast: false

        steps:
            - name: Checkout Source code
              uses: actions/checkout@v4
              # with:
              #    submodules: true

            - name: Install Qt
              uses: jurplel/install-qt-action@v4
              with:
                version: '6.8.0'
                cache: true
                cache-key-prefix: 'Qt'

            - name: Configure CMake
              # Configure CMake in a 'build' subdirectory.
              # `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
              # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
              run: >
                  cmake -B ${{github.workspace}}/build -DBUILD_TEST=ON

            - name: Build
              # Build your program with the given configuration.
              # Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
              run: cmake --build ${{github.workspace}}/build

            - name: Test
              working-directory: ${{github.workspace}}/build
              # Execute tests defined by the CMake configuration.
              # Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
              # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
              run: ctest

    windows-build:
        runs-on: windows-latest
        strategy:
            fail-fast: false

        steps:
            - uses: actions/checkout@v4
              # with:
              #    submodules: true

            - name: Install Qt
              uses: jurplel/install-qt-action@v4
              with:
                  version: 6.8.0
                  cache: true
                  cache-key-prefix: 'Qt'

            - name: Configure CMake
              # Configure CMake in a 'build' subdirectory.
              # `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
              # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
              run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release
            - name: Build
              # Build your program with the given configuration.
              # Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
              run: cmake --build ${{github.workspace}}/build --config Release

            - name: Test
              working-directory: ${{github.workspace}}/build
              # Execute tests defined by the CMake configuration.
              # Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
              # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
              run: ctest --build-config Release

    macos-build:
      runs-on: macos-latest
      strategy:
          fail-fast: false

      steps:
          - uses: actions/checkout@v4
            # with:
            #    submodules: true

          - name: Install Qt
            uses: jurplel/install-qt-action@v4
            with:
                version: 6.8.0
                cache: true
                cache-key-prefix: 'Qt'

          - name: Configure CMake
            run: cmake -B ${{github.workspace}}/build

          - name: Build
            run: cmake --build ${{github.workspace}}/build         

          - name: Test
            working-directory: ${{github.workspace}}/build
            run: ctest